name: shellcheck
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning ctxprobe
      - name: help text must not crash
        run: ./ctxprobe --help > /dev/null
      - name: bad arguments must be rejected, not crash
        run: |
          ! ./ctxprobe 2>/dev/null
          ! ./ctxprobe /nonexistent.gguf 2>/dev/null
          ! ./ctxprobe /dev/null --min 2>/dev/null
          ! ./ctxprobe /dev/null --min abc 2>/dev/null
